<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Ilustración representativa de Limón, Costa Rica</title>
<desc id="desc">Paisaje caribeño con mar, vegetación tropical, puerto, banano, tortuga y cultura afrocaribeña.</desc>
<defs>
  <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#69d7ff"/>
    <stop offset="1" stop-color="#e8fbff"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" x2="1">
    <stop offset="0" stop-color="#07a6d9"/>
    <stop offset="1" stop-color="#42d4c5"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" x2="1">
    <stop offset="0" stop-color="#ffe08a"/>
    <stop offset="1" stop-color="#f8c85a"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter>
</defs>

<rect width="1200" height="800" rx="42" fill="url(#sky)"/>
<circle cx="1030" cy="125" r="70" fill="#ffd83d"/>
<g fill="#fff" opacity=".9">
  <ellipse cx="195" cy="120" rx="95" ry="32"/>
  <ellipse cx="265" cy="125" rx="70" ry="25"/>
  <ellipse cx="870" cy="185" rx="100" ry="30"/>
</g>

<path d="M0 430 C200 360, 340 425, 520 390 S850 335,1200 405 V800 H0Z" fill="url(#sea)"/>
<path d="M0 590 C210 520, 420 610, 630 565 S980 515,1200 580 V800 H0Z" fill="url(#sand)"/>
<path d="M0 375 C180 260, 350 315, 510 225 C670 130, 825 285, 1200 210 V470 C940 420,790 430,600 470 C385 515,210 435,0 500Z" fill="#39a84d"/>
<path d="M0 410 C180 310, 315 355, 485 270 C655 190,815 315,1200 255 V445 C970 420,790 440,600 485 C380 535,200 465,0 520Z" fill="#207c3c"/>

<!-- Port -->
<g transform="translate(760 300)" filter="url(#shadow)">
  <rect x="0" y="120" width="350" height="24" rx="8" fill="#5e4a39"/>
  <rect x="44" y="52" width="30" height="74" fill="#28364b"/>
  <path d="M58 55 L58 0 L150 52" fill="none" stroke="#28364b" stroke-width="15"/>
  <path d="M150 52 V118" stroke="#28364b" stroke-width="12"/>
  <rect x="115" y="85" width="65" height="34" fill="#f05a38"/>
  <rect x="185" y="85" width="65" height="34" fill="#f7c736"/>
  <rect x="255" y="85" width="65" height="34" fill="#2e7ab8"/>
  <path d="M10 150 H335 L300 205 H65Z" fill="#eff6fa" stroke="#28364b" stroke-width="8"/>
  <rect x="88" y="151" width="170" height="38" fill="#2e7ab8"/>
</g>

<!-- Palm trees -->
<g transform="translate(120 270)" filter="url(#shadow)">
  <path d="M90 300 C120 190 110 90 140 0" stroke="#8d552f" stroke-width="30" fill="none"/>
  <g transform="translate(140 10)" fill="#197a36">
    <path d="M0 0 C-90 -70 -150 -50 -185 -10 C-100 -22 -48 -16 0 0"/>
    <path d="M0 0 C-55 -110 -10 -150 35 -168 C20 -85 10 -45 0 0"/>
    <path d="M0 0 C90 -80 160 -45 195 0 C100 -20 45 -12 0 0"/>
    <path d="M0 0 C65 -115 25 -155 -20 -180 C-15 -92 -8 -42 0 0"/>
  </g>
</g>

<!-- Banana plant -->
<g transform="translate(420 400)" filter="url(#shadow)">
  <path d="M70 180 C75 115 76 60 70 5" stroke="#4c8f2f" stroke-width="18" fill="none"/>
  <g fill="#55ad36">
    <ellipse cx="10" cy="55" rx="78" ry="25" transform="rotate(-28 10 55)"/>
    <ellipse cx="135" cy="50" rx="78" ry="25" transform="rotate(28 135 50)"/>
    <ellipse cx="17" cy="105" rx="70" ry="22" transform="rotate(-12 17 105)"/>
    <ellipse cx="128" cy="110" rx="70" ry="22" transform="rotate(12 128 110)"/>
  </g>
  <g fill="#ffd43b" stroke="#aa7b00" stroke-width="4">
    <path d="M55 85 q18 30 38 0 q-2 45 -18 54 q-18 -10 -20 -54"/>
    <path d="M77 88 q18 30 38 0 q-2 45 -18 54 q-18 -10 -20 -54"/>
    <path d="M99 84 q18 30 38 0 q-2 45 -18 54 q-18 -10 -20 -54"/>
  </g>
</g>

<!-- Turtle -->
<g transform="translate(770 610)" filter="url(#shadow)">
  <ellipse cx="85" cy="55" rx="85" ry="58" fill="#4da86b" stroke="#1d6841" stroke-width="8"/>
  <path d="M25 55 Q85 8 145 55 Q85 100 25 55Z" fill="#79c879"/>
  <circle cx="180" cy="55" r="28" fill="#4da86b" stroke="#1d6841" stroke-width="8"/>
  <path d="M25 20 l-42 -26 l22 48 M25 90 l-42 26 l22 -48 M145 20 l38 -28 l-18 50 M145 90 l38 28 l-18 -50" fill="#4da86b" stroke="#1d6841" stroke-width="8" stroke-linejoin="round"/>
</g>

<!-- Cultural drums -->
<g transform="translate(520 545)" filter="url(#shadow)">
  <ellipse cx="85" cy="18" rx="70" ry="24" fill="#f6d58d" stroke="#5c3824" stroke-width="8"/>
  <path d="M16 20 L35 155 Q85 180 135 155 L154 20" fill="#d7632c" stroke="#5c3824" stroke-width="8"/>
  <path d="M45 35 L55 155 M80 35 L85 170 M120 35 L110 155" stroke="#f6c33f" stroke-width="10"/>
</g>

<g transform="translate(55 50)" filter="url(#shadow)">
  <rect width="520" height="145" rx="28" fill="#ffffff" opacity=".94"/>
  <text x="32" y="62" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#126b43">LIMÓN</text>
  <text x="34" y="108" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#24364b">Caribe, cultura, naturaleza y actividad portuaria</text>
</g>
</svg>