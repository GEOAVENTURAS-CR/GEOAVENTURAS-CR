<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Mapa de Costa Rica con forma realista y provincias</title>
<desc id="desc">Mapa estilizado de Costa Rica con forma más real, dividido por provincias. Limón aparece habilitada en verde y las demás provincias en gris. El diseño incluye mar, relieve suave y estilo de aventura educativa.</desc>
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9f6ff"/>
    <stop offset="1" stop-color="#f4fcff"/>
  </linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#88cf61"/>
    <stop offset="1" stop-color="#3d934b"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-opacity=".18"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".14"/></filter>
</defs>

<rect width="1000" height="620" rx="36" fill="url(#sea)"/>

